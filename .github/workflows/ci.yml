on: [push, pull_request]

jobs:
    CI:
        name: Lint and Tests on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest]
        steps:
            - uses: actions/checkout@v6
              with:
                submodules: true
                fetch-depth: 0
            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                node-version-file: .nvmrc
            - name: Install dependencies
              run: npm ci
            - name: Run linter
              run: npm run lint
            - name: Run tests
              run: npm run test
